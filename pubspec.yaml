name: zerotrust_browser
description: "Zero-Trust Browser: a private web browser that blocks trackers, with bookmarks and history end-to-end encrypted in your Zero-Trust account."
publish_to: none
version: 0.4.1+7

environment:
  sdk: ^3.9.0

# Builds SQLite3MultipleCiphers instead of plain SQLite, so the core's local
# store is encrypted as a whole file (see Zero-Trust-Core README, "Sync").
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Shared account, keys, sync, settings and look of every Zero-Trust app.
  # Never add cryptography_flutter: it breaks the core's key derivation.
  zero_trust_core:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zero_trust_core
      ref: v0.10.0
  flutter_riverpod: ^3.5.0
  supabase_flutter: ^2.9.0
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.1
  share_plus: ^13.3.1
  # Share a page as a QR code (BSD-3-Clause).
  qr_flutter: ^4.1.0
  # Weekly blocklist updates: download, check the signature, keep the file.
  http: ^1.6.0
  cryptography: ^2.9.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  # The app's own texts, English and Hebrew (lib/l10n).
  intl: any
  # Lock private tabs behind fingerprint, face or screen lock (B29). Already
  # in the app through the core; listed because the browser calls it.
  local_auth: ^3.0.2

dev_dependencies:
  # Release checks every Zero-Trust app runs in CI (keys, sync, sign-in, app
  # setup, database). Independent of zero_trust_core, so it may be newer.
  zt_release_checks:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zt_release_checks
      ref: b43fcd045722bc364ef2eaa739db181f9dac144f
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Builds lib/l10n/generated from the .arb files (English and Hebrew).
  generate: true
  assets:
    - .env
    - assets/blocklist/
    - assets/reader/
    # Firefox's translation engine (Bergamot, MPL-2.0) for B16.
    - assets/translate/
    - assets/translate/worker/
