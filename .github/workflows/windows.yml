# Builds the Windows desktop app (WebView2).
#
# Pull requests: shows a change still builds and starts on Windows before it
# is merged. The zipped app is attached to the run as an artifact (Summary
# page).
#
# Releases: android-apk.yml calls this workflow on every push to main and
# adds the zip to the same GitHub Release as the APK, so the Windows app is
# downloaded from the release page like the phone app.
#
# To use the app: unzip it into its own folder and start
# zerotrust_browser.exe. The WebView2 Runtime comes with Windows 10 and 11.
name: Windows

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Give the build the release number (1000 + run number), like the APK beside it.
        type: boolean
        default: false
    secrets:
      ENV_FILE:
        description: Optional .env to use instead of the public values below.
        required: false
    outputs:
      zip:
        description: The artifact name; the file inside is this name plus ".zip".
        value: ${{ jobs.windows.outputs.zip }}

permissions:
  contents: read

concurrency:
  # github.workflow is the calling workflow's name in a release, so a manual
  # run here never cancels the build of a release.
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      zip: ${{ steps.names.outputs.zip }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Same pin as the Android build (Flutter 3.50 fails analyze).
          flutter-version: 3.47.9
          cache: true

      - name: Write .env when it is not committed
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -f .env ]; then
            echo "Using the .env committed in the repository."
          elif [ -n "$ENV_FILE" ]; then
            printf '%s\n' "$ENV_FILE" > .env
          else
            cat > .env <<'ENVEOF'
          SUPABASE_URL=https://ohgxpnchqmisvktqjmcx.supabase.co
          SUPABASE_ANON_KEY=sb_publishable_C1geAnwr0LZSxfQKRg21YA_G-OXHYky
          ENVEOF
          fi

      - name: Version and file name
        id: names
        shell: pwsh
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          $match = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)\+(\d+)').Matches[0]
          $version = $match.Groups[1].Value
          $build = $match.Groups[2].Value
          # A release gets the same build number as its APK (android-apk.yml).
          if ($env:RELEASE -eq 'true') { $build = 1000 + [int]$env:GITHUB_RUN_NUMBER }
          $name = "zero-trust-browser-windows-$version-build$build"
          "BUILD=$build" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append
          "zip=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build
        shell: pwsh
        run: flutter build windows --release "--build-number=$env:BUILD"

      - name: Zip the app
        # Before the app runs, so the zip holds only what the build made.
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "$env:ZIP_NAME.zip"

      - name: Start the app once
        # A build can compile and still not start (a missing DLL, a crash in
        # the engine). Start it, wait 20 seconds, and fail when it closed by
        # itself. The screenshot shows what a person would see.
        shell: powershell
        run: |
          $exe = (Resolve-Path build/windows/x64/runner/Release/zerotrust_browser.exe).Path
          $app = Start-Process -FilePath $exe -PassThru
          $null = $app.Handle  # without this the exit code is not kept
          Start-Sleep -Seconds 20
          $app.Refresh()
          if ($app.HasExited) {
            Write-Host "::error::The app closed by itself within 20 seconds (exit code $($app.ExitCode))."
            exit 1
          }
          try {
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
            $bitmap.Save("$PWD\windows-first-screen.png", [System.Drawing.Imaging.ImageFormat]::Png)
          } catch {
            Write-Host "::warning::The app started, but no screenshot could be taken: $_"
          }
          Stop-Process -Id $app.Id -Force
          Write-Host "The app started and stayed open."

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('windows-first-screen.png') != ''
        with:
          name: windows-first-screen
          path: windows-first-screen.png
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip
          retention-days: 30
